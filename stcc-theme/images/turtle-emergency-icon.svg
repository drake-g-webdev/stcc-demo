<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sea Turtle Emergency Icon -->

  <!-- Head -->
  <ellipse cx="50" cy="18" rx="10" ry="12" fill="#2d7d9e"/>
  <circle cx="46" cy="14" r="2" fill="#052d67"/>
  <circle cx="54" cy="14" r="2" fill="#052d67"/>

  <!-- Front Flippers -->
  <ellipse cx="22" cy="38" rx="16" ry="8" fill="#2d7d9e" transform="rotate(-35 22 38)"/>
  <ellipse cx="78" cy="38" rx="16" ry="8" fill="#2d7d9e" transform="rotate(35 78 38)"/>

  <!-- Back Flippers -->
  <ellipse cx="28" cy="75" rx="12" ry="6" fill="#2d7d9e" transform="rotate(-25 28 75)"/>
  <ellipse cx="72" cy="75" rx="12" ry="6" fill="#2d7d9e" transform="rotate(25 72 75)"/>

  <!-- Tail -->
  <ellipse cx="50" cy="88" rx="4" ry="8" fill="#2d7d9e"/>

  <!-- Shell (main body) -->
  <ellipse cx="50" cy="52" rx="32" ry="28" fill="#052d67"/>

  <!-- Shell pattern - outer ring -->
  <ellipse cx="50" cy="52" rx="28" ry="24" fill="none" stroke="#2d7d9e" stroke-width="2"/>

  <!-- Red Cross on Shell -->
  <rect x="44" y="36" width="12" height="32" rx="2" fill="#dc3545"/>
  <rect x="34" y="46" width="32" height="12" rx="2" fill="#dc3545"/>

  <!-- White cross border for better visibility -->
  <rect x="45" y="37" width="10" height="30" rx="1" fill="none" stroke="white" stroke-width="0.5" opacity="0.5"/>
  <rect x="35" y="47" width="30" height="10" rx="1" fill="none" stroke="white" stroke-width="0.5" opacity="0.5"/>
</svg>
